name: Build VIP9000 Galcore Kernel Module

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Cross Compiler & Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu bison flex libssl-dev libncurses5-dev libelf-dev bc

    - name: Download Linux 5.15 Kernel Source
      run: |
        wget https://cdn.kernel.org/pub/linux/kernel/v5.x/linux-5.15.158.tar.xz
        tar -xf linux-5.15.158.tar.xz

    - name: Restore Config and Prepare Kernel
      run: |
        cd linux-5.15.158
        echo "${{ secrets.KERNEL_CONFIG }}" > .config
        ./scripts/config --enable CONFIG_MODULES
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- prepare

    - name: Clone Khadas NPU Driver Source
      run: |
        cd linux-5.15.158
        git clone -b khadas-vims-5.15.y https://github.com/khadas/common_drivers.git common_drivers

    - name: Build galcore.ko
      run: |
        cd linux-5.15.158
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
          M=common_drivers/drivers/npu \
          CONFIG_AMLOGIC_NPU=m \
          CONFIG_AMLOGIC_DRIVER_BUILD_CONFIG=y \
          CONFIG_AMLOGIC_NPU_VIP9000=y \
          modules -j$(nproc)

    - name: Upload galcore.ko Artifact
      uses: actions/upload-artifact@v4
      with:
        name: galcore-driver
        path: linux-5.15.158/common_drivers/drivers/npu/galcore.ko

name: Build VIP9000 Galcore Kernel Module

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Cross Compiler & Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu bison flex libssl-dev libncurses5-dev libelf-dev bc

    - name: Download Linux 5.15 Kernel Source
      run: |
        wget https://cdn.kernel.org/pub/linux/kernel/v5.x/linux-5.15.158.tar.xz
        tar -xf linux-5.15.158.tar.xz

    - name: Restore Config and Prepare Kernel
      run: |
        cd linux-5.15.158
        echo "${{ secrets.KERNEL_CONFIG }}" > .config
        
        # 1. 匹配 flippy 内核的版本号后缀
        sed -i 's/^EXTRAVERSION =.*/EXTRAVERSION = -flippy-89+o/' Makefile
        
        # 2. 对齐 vermagic 必须的所有内核选项 (MODULES, UNLOAD, PREEMPT)
        ./scripts/config --enable CONFIG_MODULES
        ./scripts/config --enable CONFIG_MODULE_UNLOAD
        ./scripts/config --enable CONFIG_PREEMPT

        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- modules_prepare

    - name: Clone Khadas NPU Driver Source
      run: |
        cd linux-5.15.158
        git clone -b khadas-vims-5.15.y https://github.com/khadas/common_drivers.git common_drivers

    - name: Patch Driver Source Code for Kernel 5.15, GCC & DTB Matching
      run: |
        cd linux-5.15.158/common_drivers/drivers/npu
        
        # 1. 注入 "vivante,gc" 兼容性字符串，使驱动支持原生设备树匹配
        echo "===> Injecting 'vivante,gc' compatible string for DTB matching..."
        find . -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i 's/"amlogic, npu"/"vivante,gc", "amlogic, npu"/g' {} +
        grep -rn "vivante,gc" . || true

        # 2. 修复 strtoint_from_user API 变动
        sed -i 's/strtoint_from_user(\([^,]*\),\s*\([^,]*\),\s*\([^)]*\))/kstrtoint_from_user(\1, \2, 10, \3)/g' hal/os/linux/kernel/gc_hal_kernel_device.c
        
        # 3. 修复 _QuerySignal 返回类型不一致问题
        sed -i 's/gctBOOL/gceSTATUS/g' hal/os/linux/kernel/gc_hal_kernel_linux.h
        
        # 4. 移除驱动内部 Makefile 里的 -Werror
        find . -name "Kbuild" -o -name "Makefile*" | xargs sed -i 's/-Werror//g'
        
        # 5. 解决 AQROOT 与 drivers/npu 相对路径依赖的双重逻辑
        mkdir -p drivers
        ln -s .. drivers/npu
        
        # 6. 强制将头文件路径写入 Kbuild 文件的 ccflags-y
        NPU_ABS="$(pwd)"
        echo "ccflags-y += -I$NPU_ABS/hal/inc -I$NPU_ABS/hal/os/linux/kernel -I$NPU_ABS/hal/user -I$NPU_ABS/hal/arch/XAQ2 -Wno-error -Wno-enum-int-mismatch -Wno-unused-function" >> Kbuild

    - name: Build galcore.ko
      run: |
        cd linux-5.15.158
        NPU_ROOT="$(pwd)/common_drivers/drivers/npu"
        
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
          AQROOT="$NPU_ROOT" \
          GCDRV_DIR_LINUX="$NPU_ROOT/hal/os/linux/kernel" \
          M=common_drivers/drivers/npu \
          CONFIG_AMLOGIC_NPU=m \
          CONFIG_AMLOGIC_DRIVER_BUILD_CONFIG=y \
          CONFIG_AMLOGIC_NPU_VIP9000=y \
          modules -j$(nproc)

    - name: Upload galcore.ko Artifact
      uses: actions/upload-artifact@v4
      with:
        name: galcore-driver
        path: linux-5.15.158/common_drivers/drivers/npu/galcore.ko
